version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: uganda_learning_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-uganda_learning_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uganda_learning_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: uganda_learning_ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        limits:
          memory: 8G

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uganda_learning_backend
    restart: always
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - .:/app
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
      - logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uganda_learning_celery
    restart: always
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - .:/app
      - logs:/app/logs
    depends_on:
      - backend
      - redis
    command: celery -A config.celery worker --loglevel=info --concurrency=4

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uganda_learning_beat
    restart: always
    env_file: .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    volumes:
      - .:/app
    depends_on:
      - backend
      - redis
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uganda_learning_flower
    restart: always
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: celery -A config.celery flower --port=5555

  nginx:
    image: nginx:alpine
    container_name: uganda_learning_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/mediafiles:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  static_files:
  media_files:
  logs:
